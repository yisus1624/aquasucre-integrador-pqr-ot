<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Detalle PQR - AquaSucre</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .field { margin-bottom: 10px; }
        .label { font-weight: bold; }
        .error { color: red; }
    </style>
</head>
<body>
    <h1>Detalle de PQR</h1>
    <a href="/">Volver al listado</a>
    {% if error %}<p class="error">Error: {{ error }}</p>{% endif %}
    {% if ticket %}
        <div class="field"><span class="label">Nombre:</span> {{ ticket.name }}</div>
        <div class="field"><span class="label">Asunto:</span> {{ ticket.subject }}</div>
        <div class="field"><span class="label">Estado:</span> {{ ticket.status }}</div>
        <div class="field"><span class="label">Prioridad:</span> {{ ticket.priority }}</div>
        <div class="field"><span class="label">Descripción:</span> {{ ticket.description }}</div>
    {% endif %}
</body>
</html>
